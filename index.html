<style>
/* ===== Design tokens ===== */
:root{
  --bg:#ddd7ff; --bg2:#c9efe8; --card:#f3f1ff; --card-2:#e9e5ff; --ink:#120f3a; --ink-2:#2a2660; --muted:#5a5687; --line:#c9c1fb;
  --brand:#4a33f2; --brand-600:#3a22dc; --brand-50:#e2dcff; --brand-100:#d2caff;
  --teal:#00a492; --teal-50:#c9f0ea; --amber:#d27a00; --amber-50:#ffe7bd; --rose:#e12c50; --rose-50:#ffd6de; --green:#0b9b62; --green-50:#c8f1df;
  --shadow-sm:0 1px 2px rgba(18,15,58,.08),0 2px 6px rgba(18,15,58,.06);
  --shadow:0 12px 30px -14px rgba(48,30,170,.45),0 4px 10px -6px rgba(18,15,58,.12);
  --r:14px; --r-lg:20px; --hdr:54px;
  --font:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif; --font-h:'Rubik','Heebo',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;overflow:hidden;font-family:var(--font);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:radial-gradient(70% 50% at 100% 0%,#cfc6ff 0%,transparent 70%),radial-gradient(60% 50% at 0% 100%,var(--bg2) 0%,transparent 70%),var(--bg)}
h1,h2,h3{font-family:var(--font-h);line-height:1.2;margin:0;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid #7a68ff;outline-offset:2px;border-radius:8px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:0;border-radius:12px;padding:.7em 1.1em;font-weight:700;font-size:1rem;transition:transform .15s ease,box-shadow .2s ease,background .2s ease;white-space:nowrap;min-height:46px}
.btn:active{transform:translateY(1px) scale(.99)}
.btn-primary{background:linear-gradient(135deg,#5a43ff,#3a22dc);color:#fff;box-shadow:0 8px 18px -8px rgba(58,34,220,.8)}
.btn-lg{padding:.9em 1.6em;font-size:1.08rem;border-radius:14px;min-height:54px}
.btn-ghost{background:var(--card);color:var(--ink-2);border:1.5px solid var(--line)}
.btn-soft{background:var(--brand-50);color:var(--brand-600)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn svg{width:1.15em;height:1.15em;flex:none}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.28em .7em;border-radius:99px;background:var(--brand-600);color:#fff;font-weight:700;font-size:.8rem;white-space:nowrap}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px}
.ico.v{background:var(--brand-50);color:var(--brand-600)}.ico.t{background:var(--teal-50);color:var(--teal)}.ico.a{background:var(--amber-50);color:var(--amber)}.ico.r{background:var(--rose-50);color:var(--rose)}

/* ===== Header ===== */
.top{position:fixed;top:0;left:0;right:0;z-index:40;height:calc(var(--hdr) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);background:linear-gradient(90deg,#3a22dc,#5a43ff 60%,#2a9d93);color:#fff;box-shadow:0 4px 14px -8px rgba(30,15,120,.7)}
.top .wrap{display:flex;align-items:center;gap:8px;height:100%}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:0 14px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--font-h);font-weight:800;font-size:1.12rem;color:#fff;white-space:nowrap;background:none;border:0;padding:0}
.logo-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#3a22dc,#00a492);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35);display:grid;place-items:center}
.nav{margin-inline-start:auto;display:flex;gap:2px;align-items:center}
.nav button{background:none;border:0;padding:.45em .6em;border-radius:10px;font-weight:600;color:#fff;display:flex;align-items:center;gap:.4em;font-size:.95rem;min-height:40px;position:relative}
.nav button.on{background:rgba(255,255,255,.2)}
.nav svg{width:20px;height:20px}
.nav .lbl{display:none}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:#ff3d63;color:#fff;font-size:.7rem;display:inline-grid;place-items:center;font-weight:700;position:absolute;top:2px;inset-inline-end:0}
@media (min-width:720px){.nav .lbl{display:inline}.badge{position:static}}

/* ===== App shell: every view fits the screen ===== */
main{position:fixed;top:calc(var(--hdr) + env(safe-area-inset-top));left:0;right:0;bottom:0}
.view{display:none;height:100%;animation:fade .3s ease}
.view.on{display:block}
.screen{height:100%;display:flex;flex-direction:column;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));max-width:1100px;margin:0 auto;overflow-y:auto}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Landing ===== */
.hero{justify-content:center;align-items:center;text-align:center;gap:14px}
.hero h1{font-size:clamp(1.9rem,8vw,3.2rem);font-weight:800}
.grad{background:linear-gradient(90deg,#3a22dc,#00a492);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{font-size:1.05rem;color:var(--ink-2);font-weight:500}
.preview{width:100%;max-width:560px;flex:0 1 auto;min-height:0;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:8px;position:relative}
.preview svg{display:block;width:100%;height:auto;max-height:42vh}
.toast-ok{position:absolute;bottom:14px;left:50%;transform:translate(-50%,6px);display:inline-flex;align-items:center;gap:6px;background:var(--green);color:#fff;padding:.35em .8em;border-radius:10px;font-weight:700;font-size:.88rem;opacity:0;transition:.35s;white-space:nowrap}
.toast-ok.show{opacity:1;transform:translate(-50%,0)}

/* ===== Practice selection ===== */
.seg{display:flex;background:var(--card-2);border-radius:14px;padding:4px;gap:4px;border:1.5px solid var(--line)}
.seg button{flex:1;border:0;background:none;padding:.5em .4em;border-radius:10px;font-weight:700;color:var(--ink-2);display:flex;gap:7px;align-items:center;justify-content:center;min-height:42px}
.seg button.on{background:var(--brand-600);color:#fff;box-shadow:var(--shadow-sm)}
.bars{display:flex;gap:2px;align-items:flex-end;height:16px}
.bars i{width:4px;border-radius:2px;background:currentColor;opacity:.3;display:block}
.bars i:nth-child(1){height:6px}.bars i:nth-child(2){height:11px}.bars i:nth-child(3){height:16px}
.bars.l1 i:nth-child(-n+1),.bars.l2 i:nth-child(-n+2),.bars.l3 i:nth-child(-n+3){opacity:1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:8px 6px;text-align:center}
.kpi b{font-family:var(--font-h);font-size:1.3rem;display:block;line-height:1.1;color:var(--brand-600)}
.kpi span{color:var(--muted);font-size:.78rem;font-weight:600}
.reco{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,#3a22dc,#2a9d93);color:#fff;border:0;border-radius:var(--r);padding:10px 12px;text-align:start;box-shadow:var(--shadow);width:100%}
.reco .ico{background:rgba(255,255,255,.2);color:#fff}
.reco div{flex:1;min-width:0}
.reco small{display:block;opacity:.85;font-size:.78rem;font-weight:600}
.reco b{font-family:var(--font-h);font-size:1rem}
.reco > svg{width:20px;height:20px;flex:none}
.cats{display:grid;gap:8px}
@media (min-width:800px){.cats{grid-template-columns:1fr 1fr}}
.cat{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:start;width:100%;box-shadow:var(--shadow-sm);transition:border-color .2s,transform .2s}
.cat:active{transform:scale(.99)}.cat:hover{border-color:#a99bff}
.cat div{flex:1;min-width:0}
.cat h3{font-size:1.02rem;display:flex;justify-content:space-between;gap:8px}
.cat h3 span{font-family:var(--font);font-size:.85rem;color:var(--muted);font-weight:700}
.cat.done h3 span{color:var(--green)}
.progress{height:7px;background:var(--card-2);border-radius:99px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#4a33f2,#00a492);border-radius:99px;transition:width .6s ease}
.cat > svg{width:18px;height:18px;color:var(--muted);flex:none}
.allDone{background:var(--green-50);color:#076b44;border-radius:var(--r);padding:10px 12px;font-weight:700;text-align:center}

/* ===== Exercise screen ===== */
.play{gap:8px}
.ex-top{display:flex;align-items:center;gap:8px}
.iconbtn{background:var(--card);border:1.5px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;flex:none;padding:0}
.iconbtn svg{width:20px;height:20px}
.ex-progress{flex:1;min-width:60px}
.ex-progress .progress{margin:0}
.ex-count{font-weight:700;font-size:.85rem;color:var(--muted);white-space:nowrap}
.task{font-family:var(--font-h);font-size:1.08rem;font-weight:700}
.task small{display:block;font-family:var(--font);font-weight:500;font-size:.88rem;color:var(--muted);margin-top:2px}
.ex-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.board-card{flex:0 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:6px;box-shadow:var(--shadow)}
.board-card svg{display:block;width:100%;height:auto;aspect-ratio:814/608;max-height:calc(100dvh - var(--hdr) - 250px);min-height:0;touch-action:none;user-select:none;-webkit-user-select:none}
.pip{display:flex;justify-content:center;gap:12px;font-size:.8rem;color:var(--muted);font-weight:600;padding-top:4px}
.pip b{color:var(--ink);font-variant-numeric:tabular-nums}
.panel{flex:none;margin-top:auto}
.moves-line{min-height:24px;margin-bottom:8px;font-size:.92rem;text-align:center;color:var(--muted)}
.moves-line .ltr{background:var(--card-2);color:var(--ink);border-radius:8px;padding:1px 8px;font-weight:700}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;font-weight:700;min-height:52px}
.opt:hover{border-color:#a99bff}
.opt.right{border-color:var(--green);background:var(--green-50)}
.opt.wrong{border-color:var(--rose);background:var(--rose-50)}
.opt[disabled]{cursor:default}
@media (min-width:900px){
  .ex-main{flex-direction:row;align-items:flex-start}
  .board-card{flex:1}
  .board-card svg{max-height:calc(100dvh - var(--hdr) - 150px)}
  .panel{width:340px;display:flex;flex-direction:column;justify-content:flex-end;margin-top:0}
}
/* feedback */
.fb{border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;margin-bottom:8px;animation:pop .3s ease}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.fb .ico{width:36px;height:36px;background:rgba(255,255,255,.6)}
.fb b{font-family:var(--font-h);font-size:1.05rem;display:block}
.fb p{font-size:.9rem;font-weight:600}
.fb.correct{background:var(--green-50);color:#065c3a}.fb.correct .ico{color:var(--green)}
.fb.near{background:var(--amber-50);color:#7a4a00}.fb.near .ico{color:var(--amber)}
.fb.wrong{background:var(--rose-50);color:#9a1530}.fb.wrong .ico{color:var(--rose)}
.after{display:grid;grid-template-columns:1fr 2fr;gap:8px}

/* explanation sheet + glossary */
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(18,15,58,.5);backdrop-filter:blur(3px)}
.modal.on{display:flex;animation:fade .2s}
.sheet{background:var(--card);width:100%;max-width:620px;max-height:86vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1.5px solid var(--line)}
.sheet-head h2{font-size:1.15rem;flex:1}
.x{background:var(--card-2);border:0;border-radius:10px;width:38px;height:38px;display:grid;place-items:center}
.x svg{width:18px;height:18px}
.sheet-body{overflow:auto;padding:12px 16px 20px}
.principle{display:flex;gap:8px;background:var(--brand-50);color:#2b18b0;border-radius:12px;padding:9px 11px;font-weight:700;font-size:.93rem;margin-bottom:10px}
.principle svg{width:19px;height:19px;flex:none;margin-top:2px}
.why{color:var(--ink-2);margin-bottom:10px}
.alts{list-style:none;padding:0;margin:0;display:grid;gap:7px}
.alts li{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font-size:.9rem;background:#fbfaff}
.alts .row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.alts p{margin-top:3px;color:var(--muted)}
.tag{font-size:.72rem;font-weight:700;border-radius:99px;padding:.15em .6em}
.tag.best{background:var(--green-50);color:#076b44}.tag.near{background:var(--amber-50);color:#7a4a00}.tag.bad{background:var(--rose-50);color:#9a1530}.tag.you{background:var(--card-2);color:var(--ink-2)}
.metric{margin-inline-start:auto;font-size:.78rem;color:var(--muted)}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sheet-actions .btn{flex:1;min-width:120px}
.term{background:none;border:0;padding:0;color:inherit;border-bottom:2px dotted #8f7dff;cursor:help;font:inherit}
.gsearch{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:.65em 1em;font:inherit;margin-bottom:8px;background:#fbfaff}
.gitem{padding:10px 0;border-bottom:1px solid var(--line)}
.gitem:last-child{border:0}
.gitem b{font-family:var(--font-h);color:var(--brand-600)}
.gitem small{color:var(--muted);margin-right:8px}
.gitem p{color:var(--ink-2)}
.gitem.flash{background:var(--brand-50);border-radius:10px;padding-inline:10px}

/* summary */
.sum{justify-content:center;align-items:center;text-align:center}
.sum-card{width:100%;max-width:440px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:22px 18px;box-shadow:var(--shadow)}
.score-ring{width:120px;height:120px;margin:0 auto 12px;position:relative}
.score-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.score-ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-h);font-size:1.8rem}
.sum-split{display:flex;justify-content:center;gap:8px;margin:12px 0 16px;flex-wrap:wrap}
.sum-split span{padding:.35em .7em;border-radius:10px;font-weight:700;font-size:.88rem}
.sum-actions{display:grid;gap:8px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <button class="logo" data-go="#/" aria-label="דף הבית">
<span class="logo-mark"><svg width="32" height="32" viewBox="0 0 64 64"><path d="M14 13h16l-8 27z" fill="#fff"/><path d="M34 51h16l-8-27z" fill="#fff"/><circle cx="22" cy="48" r="5" fill="#fff" fill-opacity=".6"/><circle cx="42" cy="16" r="5" fill="#fff" fill-opacity=".6"/></svg></span>
      <span dir="ltr">Backgammon Solver</span>
    </button>
    <nav class="nav" aria-label="ניווט ראשי">
      <button data-go="#/practice" data-nav="practice" aria-label="תרגול"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span class="lbl">תרגול</span></button>
      <button data-go="#/review" data-nav="review" aria-label="חזרה על טעויות"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span class="lbl">טעויות</span><span class="badge" id="missBadge" hidden>0</span></button>
      <button data-glossary aria-label="מילון מושגים"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg><span class="lbl">מילון</span></button>
    </nav>
  </div>
</header>

<main>
<section class="view" id="v-home">
  <div class="screen hero">
    <h1>תפסיקו לנחש.<br><span class="grad">תתחילו להבין.</span></h1>
    <p class="lead">120 תרגילי שש בש על לוח אמיתי, עם הסבר לכל מהלך.</p>
    <button class="btn btn-primary btn-lg" data-go="#/practice">התחילו לתרגל
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="preview">
      <svg id="heroBoard" viewBox="0 0 814 608" role="img" aria-label="לוח שש בש: הפתיחה 3-1"></svg>
      <span class="toast-ok" id="heroToast"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="M20 6 9 17l-5-5"/></svg>נכון! נקודת החמש</span>
    </div>
  </div>
</section>

<section class="view" id="v-practice">
  <div class="screen">
    <div class="seg" role="tablist" aria-label="רמת קושי" id="lvlSeg"></div>
    <div class="kpis" id="kpis"></div>
    <div id="reco"></div>
    <div class="cats" id="catCards"></div>
  </div>
</section>

<section class="view" id="v-play">
  <div class="screen play">
    <div class="ex-top">
      <button class="iconbtn" id="exBack" aria-label="חזרה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      <span class="chip" id="exChip"></span>

<script>
/* ===== Backgammon rules engine =====
   Coordinates are always from the player's (white) perspective:
   points 1..24, white moves 24 -> 1 and bears off from 1..6.
   pts[i] > 0 = white checkers, pts[i] < 0 = black checkers.
   wb / bb = checkers on the bar. Step: {from (25 = bar), to (0 = off), die, hit} */
const Engine = (() => {
  function fromDef(d) {
    const pts = new Array(25).fill(0);
    for (const k in d.w) pts[+k] += d.w[k];
    for (const k in d.b) pts[+k] -= d.b[k];
    return { pts, wb: d.wb || 0, bb: d.bb || 0 };
  }
  const clone = s => ({ pts: s.pts.slice(), wb: s.wb, bb: s.bb });
  function counts(s) {
    let w = s.wb, b = s.bb;
    for (let i = 1; i <= 24; i++) { if (s.pts[i] > 0) w += s.pts[i]; else b -= s.pts[i]; }
    return { w, b, wOff: 15 - w, bOff: 15 - b };
  }
  function allHome(s) {
    if (s.wb) return false;
    for (let i = 7; i <= 24; i++) if (s.pts[i] > 0) return false;
    return true;
  }
  // All single-checker moves for one die value
  function stepsForDie(s, d) {
    const res = [];
    if (s.wb > 0) { // must enter from the bar first
      const to = 25 - d;
      if (s.pts[to] >= -1) res.push({ from: 25, to, die: d, hit: s.pts[to] === -1 });
      return res;
    }
    const home = allHome(s);
    for (let p = 24; p >= 1; p--) {
      if (s.pts[p] <= 0) continue;
      const to = p - d;
      if (to >= 1) {
        if (s.pts[to] >= -1) res.push({ from: p, to, die: d, hit: s.pts[to] === -1 });
      } else if (home) {
        if (to === 0) res.push({ from: p, to: 0, die: d, hit: false });
        else { // higher die: only from the highest occupied point
          let higher = false;
          for (let q = p + 1; q <= 6; q++) if (s.pts[q] > 0) { higher = true; break; }
          if (!higher) res.push({ from: p, to: 0, die: d, hit: false });
        }
      }
    }
    return res;
  }
  function apply(s, st) {
    const n = clone(s);
    if (st.from === 25) n.wb--; else n.pts[st.from]--;
    if (st.to > 0) {
      if (n.pts[st.to] === -1) { n.pts[st.to] = 0; n.bb++; }
      n.pts[st.to]++;
    }
    return n;
  }
  const key = s => s.pts.join(',') + '|' + s.wb + '|' + s.bb;
  // Every legal full play (all orders), honoring "use both dice / the larger die" rules
  function plays(s, dice) {
    const ds = dice[0] === dice[1] ? [dice[0], dice[0], dice[0], dice[0]] : [dice[0], dice[1]];
    const seqs = []; let maxLen = 0;
    (function rec(st, rem, seq) {
      let moved = false; const tried = new Set();
      for (let i = 0; i < rem.length; i++) {
        const d = rem[i]; if (tried.has(d)) continue; tried.add(d);
        const steps = stepsForDie(st, d);
        if (!steps.length) continue;
        const r2 = rem.slice(); r2.splice(i, 1);
        for (const stp of steps) { moved = true; rec(apply(st, stp), r2, seq.concat([stp])); }
      }
      if (!moved) { seqs.push({ seq, final: st }); if (seq.length > maxLen) maxLen = seq.length; }
    })(s, ds, []);
    let out = seqs.filter(x => x.seq.length === maxLen);
    if (maxLen === 1 && ds.length === 2 && ds[0] !== ds[1]) {
      const hi = Math.max(ds[0], ds[1]);
      if (out.some(x => x.seq[0].die === hi)) out = out.filter(x => x.seq[0].die === hi);
    }
    return out;
  }
  // Swap sides so the opponent becomes "white"
  function mirror(s) {
    const pts = new Array(25).fill(0);
    for (let i = 1; i <= 24; i++) pts[i] = -s.pts[25 - i];
    return { pts, wb: s.bb, bb: s.wb };
  }
  // Number of opponent rolls (out of 36) that hit at least one white blot
  function shots(s) {
    const m = mirror(s); let n = 0;
    for (let a = 1; a <= 6; a++) for (let b = a; b <= 6; b++) {
      const ps = plays(m, [a, b]);
      if (ps.some(p => p.seq.some(x => x.hit))) n += a === b ? 1 : 2;
    }
    return n;
  }
  function pips(s) {
    let w = s.wb * 25, b = s.bb * 25;
    for (let i = 1; i <= 24; i++) { if (s.pts[i] > 0) w += s.pts[i] * i; else if (s.pts[i] < 0) b += -s.pts[i] * (25 - i); }
    return { w, b };
  }
  // Move notation such as "8/5 6/5", "24/18*/13", "bar/20*", "6/off(2)"
  function parse(str) {
    const hops = [];
    for (const tok of str.trim().split(/\s+/)) {
      const m = tok.match(/^(.*?)(?:\((\d)\))?$/);
      const nums = m[1].split('/').map(x => x.replace('*', '')).map(x => x === 'bar' ? 25 : x === 'off' ? 0 : +x);
      const rep = +(m[2] || 1);
      for (let r = 0; r < rep; r++) for (let i = 0; i < nums.length - 1; i++) hops.push([nums[i], nums[i + 1]]);
    }
    return hops;
  }
  function applyNotation(s, str) {
    let n = clone(s);
    for (const [a, b] of parse(str)) {
      if (a === 25) n.wb--; else n.pts[a]--;
      if (b > 0) { if (n.pts[b] === -1) { n.pts[b] = 0; n.bb++; } n.pts[b]++; }
    }
    return n;
  }
  // Human-readable notation for a step sequence
  function notate(seq) {
    return seq.map(st => (st.from === 25 ? 'bar' : st.from) + '/' + (st.to === 0 ? 'off' : st.to) + (st.hit ? '*' : '')).join(' ');
  }
  return { fromDef, clone, counts, allHome, stepsForDie, apply, key, plays, mirror, shots, pips, parse, applyNotation, notate };
})();

</script>

  ['חשיפה', 'חשיפה'], ['בלוק', 'בלוק'], ['פריים', 'פריים'], ['עוגן', 'עוגן'], ['מרוץ', 'מרוץ'], ['בונים', 'בונים'], ['בונה', 'בונים'],

/* ---------- Storage (localStorage, fails safely) ---------- */
const Store = {
  k: 'mahalach.v1', d: null,
  load() {
    try { this.d = JSON.parse(localStorage.getItem(this.k)); } catch (e) { this.d = null; }
    if (!this.d || typeof this.d !== 'object') this.d = {};
    this.d = Object.assign({ res: {}, days: [], missed: [], lvl: 1, homeRight: true }, this.d);
  },
  save() { try { localStorage.setItem(this.k, JSON.stringify(this.d)); } catch (e) { /* private mode */ } },
  today() { const t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); },
  record(id, result) {
    const r = this.d.res[id] || (this.d.res[id] = { a: 0, c: 0, solved: false, last: null });
    r.a++; if (result === 'correct') { r.c++; r.solved = true; }
    r.last = result;
    const t = this.today(); if (!this.d.days.includes(t)) this.d.days.push(t);
    if (this.d.days.length > 400) this.d.days = this.d.days.slice(-400);
    const i = this.d.missed.indexOf(id);
    if (result === 'correct') { if (i >= 0) this.d.missed.splice(i, 1); }
    else if (i < 0) this.d.missed.push(id);
    this.save(); updateBadge();
  },
  streak() {
    const set = new Set(this.d.days); let n = 0; const d = new Date();
    const fmt = x => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
    if (!set.has(fmt(d))) d.setDate(d.getDate() - 1); // today not played yet: count up to yesterday
    while (set.has(fmt(d))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  },
  catStats(cat, lvl) {
    let a = 0, c = 0, solved = 0, total = 0;
    for (const ex of EXERCISES) {
      if (ex.c !== cat || (lvl && ex.l !== lvl)) continue;
      total++; const r = this.d.res[ex.id];
      if (r) { a += r.a; c += r.c; if (r.solved) solved++; }
    }
    return { a, c, solved, total, acc: a ? Math.round(c / a * 100) : null };
  }
};
function updateBadge() {
  const b = $('#missBadge'); const n = Store.d.missed.length;
  b.hidden = !n; b.textContent = n;
}

/* ===================================================================
   Board renderer (SVG). Point numbers are always from white's side.
   =================================================================== */
const G = { W: 814, H: 608, M: 14, PW: 56, BAR: 48, TRAY: 56, GAP: 10, NUM: 24, R: 25, PH: 236 };
const COL = { frame: '#1d1757', field: '#efe5cf', triA: '#4a33f2', triB: '#a9b0ec', bar: '#2a2370', tray: '#16114a',
  num: '#aab1dd', numHome: '#ffffff', hl: '#12b8a6', sel: '#ffb020' };

class Board {
  constructor(svg, opts = {}) {
    this.svg = svg; this.homeRight = opts.homeRight !== false; this.uid = 'b' + Math.random().toString(36).slice(2, 7); this.tok = 0;
  }
  cancel() { this.tok++; }
  get left() { return this.homeRight ? G.M : G.M + G.TRAY + G.GAP; }
  get trayX() { return this.homeRight ? G.M + 12 * G.PW + G.BAR + G.GAP : G.M; }
  colOf(p) { const c = p <= 12 ? 12 - p : p - 13; return this.homeRight ? c : 11 - c; }
  cx(col) { return this.left + col * G.PW + (col >= 6 ? G.BAR : 0) + G.PW / 2; }
  barX() { return this.left + 6 * G.PW + G.BAR / 2; }
  stepFor(n) { return n <= 5 ? 2 * G.R : (G.PH - 2 * G.R) / (n - 1); }
  // centre of the k-th checker (0 = base) on point p holding n checkers
  pos(p, k, n) {
    const x = this.cx(this.colOf(p)), st = this.stepFor(n);
    const y = p >= 13 ? G.NUM + G.R + 2 + k * st : G.H - G.NUM - G.R - 2 - k * st;
    return { x, y };
  }
  barPos(white, k) { const st = 2 * G.R - 8; return { x: this.barX(), y: white ? G.H / 2 - 52 - k * st : G.H / 2 + 52 + k * st }; }
  offPos(white, k) { const x = this.trayX + G.TRAY / 2; return { x, y: white ? G.H - G.NUM - 12 - k * 13 : G.NUM + 12 + k * 13 }; }
  // which zone is under an svg coordinate: 1..24, 25 = bar, 0 = off tray
  zoneAt(x, y) {
    if (x >= this.trayX && x <= this.trayX + G.TRAY) return 0;
    const bx = this.left + 6 * G.PW;
    if (x >= bx && x <= bx + G.BAR) return 25;
    let rel = x - this.left; if (rel < 0) return null;
    let col; if (rel < 6 * G.PW) col = Math.floor(rel / G.PW); else { rel -= 6 * G.PW + G.BAR; if (rel < 0 || rel >= 6 * G.PW) return null; col = 6 + Math.floor(rel / G.PW); }
    const c = this.homeRight ? col : 11 - col;
    return y < G.H / 2 ? 13 + c : 12 - c;
  }
  toSvg(e) { const pt = this.svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(this.svg.getScreenCTM().inverse()); }

  checker(x, y, white, extra = '') {
    const id = this.uid;
    return `<g ${extra}><circle cx="${x}" cy="${y + 2}" r="${G.R}" fill="rgba(0,0,0,.22)"/>` +
      `<circle cx="${x}" cy="${y}" r="${G.R}" fill="url(#${id}${white ? 'w' : 'k'})" stroke="${white ? '#8b8fa3' : '#7a80a8'}" stroke-width="2"/>` +
      `<circle cx="${x}" cy="${y}" r="${G.R - 8}" fill="none" stroke="${white ? 'rgba(120,110,80,.25)' : 'rgba(255,255,255,.16)'}" stroke-width="2"/></g>`;
  }
  render(s, o = {}) {
    const { W, H, M, PW, BAR, TRAY, NUM, R, PH } = G, id = this.uid;
    const hide = o.hide || {};
    let h = `<defs><radialGradient id="${id}w" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e7e2d4"/></radialGradient>` +
      `<radialGradient id="${id}k" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#555c84"/><stop offset="1" stop-color="#151931"/></radialGradient>` +
      `<filter id="${id}g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs>`;
    h += `<rect x="0" y="0" width="${W}" height="${H}" rx="22" fill="${COL.frame}"/>`;
    const L = this.left;
    h += `<rect x="${L}" y="${NUM}" width="${6 * PW}" height="${H - 2 * NUM}" rx="6" fill="${COL.field}"/>`;
    h += `<rect x="${L + 6 * PW + BAR}" y="${NUM}" width="${6 * PW}" height="${H - 2 * NUM}" rx="6" fill="${COL.field}"/>`;
    h += `<rect x="${L + 6 * PW}" y="${NUM - 6}" width="${BAR}" height="${H - 2 * NUM + 12}" rx="6" fill="${COL.bar}"/>`;
    h += `<rect x="${this.trayX}" y="${NUM}" width="${TRAY}" height="${H - 2 * NUM}" rx="10" fill="${COL.tray}" ${o.trayHl ? `stroke="${COL.hl}" stroke-width="4"` : ''}/>`;
    h += `<line x1="${this.trayX + 8}" x2="${this.trayX + TRAY - 8}" y1="${H / 2}" y2="${H / 2}" stroke="rgba(255,255,255,.12)" stroke-width="2"/>`;
    // triangles + numbers
    for (let p = 1; p <= 24; p++) {
      const col = this.colOf(p), x0 = L + col * PW + (col >= 6 ? BAR : 0), top = p >= 13;
      const base = top ? NUM : H - NUM, tip = top ? NUM + PH : H - NUM - PH;
      const fill = (col % 2 === 0) ? COL.triA : COL.triB;
      h += `<path d="M${x0 + 2} ${base} L${x0 + PW / 2} ${tip} L${x0 + PW - 2} ${base}Z" fill="${fill}"/>`;
      if (o.targets && o.targets.has(p)) h += `<path d="M${x0 + 2} ${base} L${x0 + PW / 2} ${tip} L${x0 + PW - 2} ${base}Z" fill="${COL.hl}" opacity=".38"/>`;
      const home = p <= 6;
      h += `<text x="${x0 + PW / 2}" y="${top ? 17 : H - 7}" text-anchor="middle" font-family="Heebo,Arial" font-size="15" font-weight="${home ? 800 : 600}" fill="${home ? COL.numHome : COL.num}">${p}</text>`;
    }
    // direction guide + quadrant labels (middle band)
    const fl = L + 8, fr = L + 12 * PW + BAR - 8, yA = H / 2 - 30, yB = H / 2 + 30;
    const homeHalfX = this.homeRight ? L + 6 * PW + BAR + 3 * PW : L + 3 * PW;
    const outerHalfX = this.homeRight ? L + 3 * PW : L + 6 * PW + BAR + 3 * PW;
    const dpath = this.homeRight
      ? `M${fr} ${yA} L${fl + 22} ${yA} Q${fl} ${yA} ${fl} ${yA + 20} L${fl} ${yB - 20} Q${fl} ${yB} ${fl + 22} ${yB} L${fr - 14} ${yB}`
      : `M${fl} ${yA} L${fr - 22} ${yA} Q${fr} ${yA} ${fr} ${yA + 20} L${fr} ${yB - 20} Q${fr} ${yB} ${fr - 22} ${yB} L${fl + 14} ${yB}`;
    h += `<path d="${dpath}" fill="none" stroke="${COL.hl}" stroke-width="2.5" stroke-dasharray="7 7" opacity=".55"/>`;
    const ax = this.homeRight ? fr - 14 : fl + 14, dir = this.homeRight ? 1 : -1;
    h += `<path d="M${ax} ${yB - 7} L${ax + 12 * dir} ${yB} L${ax} ${yB + 7}Z" fill="${COL.hl}" opacity=".8"/>`;
    h += `<text x="${homeHalfX}" y="${H / 2 - 6}" text-anchor="middle" direction="rtl" font-family="Heebo,Arial" font-size="14" font-weight="600" fill="#8a7f68">הבית של היריב</text>`;
    h += `<text x="${homeHalfX}" y="${H / 2 + 18}" text-anchor="middle" direction="rtl" font-family="Heebo,Arial" font-size="14" font-weight="800" fill="#4a3bdc">הבית שלכם</text>`;
    // checkers on points
    for (let p = 1; p <= 24; p++) {
      const v = s.pts[p]; if (!v) continue;
      const white = v > 0, n = Math.abs(v);
      for (let k = 0; k < n; k++) {
        if (white && hide.w === p && k === n - 1) continue;
        const { x, y } = this.pos(p, k, n);
        h += this.checker(x, y, white);
        if (k === n - 1) {
          if (white && o.sel === p) h += `<circle cx="${x}" cy="${y}" r="${R + 3}" fill="none" stroke="${COL.sel}" stroke-width="5"/>`;
          else if (white && o.movable && o.movable.has(p)) h += `<circle cx="${x}" cy="${y}" r="${R + 2}" fill="none" stroke="${COL.hl}" stroke-width="3.5"/>`;
          if (n > 5) h += `<text x="${x}" y="${y + 6}" text-anchor="middle" font-family="Rubik,Arial" font-weight="700" font-size="17" fill="${white ? '#3a3f5c' : '#fff'}">${n}</text>`;
        }
      }
    }
    // landing markers on target points
    if (o.targets) for (const p of o.targets) {
      if (p === 0 || p === 25) continue;
      const n = Math.max(0, s.pts[p]) + 1; const { x, y } = this.pos(p, n - 1, Math.max(n, 1));
      h += `<circle cx="${x}" cy="${y}" r="${R - 3}" fill="rgba(18,184,166,.18)" stroke="${COL.hl}" stroke-width="3" stroke-dasharray="6 5"/>`;
    }
    // bar
    for (let k = 0; k < s.wb; k++) { if (hide.w === 25 && k === s.wb - 1) continue; const q = this.barPos(true, k); h += this.checker(q.x, q.y, true); if (k === s.wb - 1 && o.movable && o.movable.has(25)) h += `<circle cx="${q.x}" cy="${q.y}" r="${R + 2}" fill="none" stroke="${o.sel === 25 ? COL.sel : COL.hl}" stroke-width="4"/>`; }
    for (let k = 0; k < s.bb; k++) { if (hide.b === 25 && k === s.bb - 1) continue; const q = this.barPos(false, k); h += this.checker(q.x, q.y, false); }
    // borne-off checkers in the tray (white bottom, black top)
    const c = Engine.counts(s);
    for (let k = 0; k < c.wOff; k++) { if (hide.w === 0 && k === c.wOff - 1) continue; const q = this.offPos(true, k); h += `<rect x="${q.x - 21}" y="${q.y - 5}" width="42" height="11" rx="4" fill="#efeadc" stroke="#9a9eb2"/>`; }
    for (let k = 0; k < c.bOff; k++) { const q = this.offPos(false, k); h += `<rect x="${q.x - 21}" y="${q.y - 5}" width="42" height="11" rx="4" fill="#2a2f50" stroke="#6b7196"/>`; }
    if (o.trayHl) h += `<text x="${this.trayX + TRAY / 2}" y="${H / 2 + 22}" text-anchor="middle" font-family="Heebo,Arial" font-size="13" font-weight="700" fill="${COL.hl}">הוצאה</text>`;
    // dice (in the outer half, like a real table)
    if (o.dice) {
      const ds = o.dice[0] === o.dice[1] ? [o.dice[0], o.dice[0], o.dice[0], o.dice[0]] : o.dice;
      const sz = ds.length === 4 ? 36 : 44, gap = 10, tot = ds.length * sz + (ds.length - 1) * gap;
      let x = outerHalfX - tot / 2;
      ds.forEach((d, i) => { h += this.die(x, H / 2 - sz / 2, sz, d, o.used && o.used[i]); x += sz + gap; });
    }
    this.svg.innerHTML = h;
  }
  die(x, y, s, v, used) {
    const P = { 1: [[.5, .5]], 2: [[.27, .27], [.73, .73]], 3: [[.27, .27], [.5, .5], [.73, .73]], 4: [[.27, .27], [.73, .27], [.27, .73], [.73, .73]],
      5: [[.27, .27], [.73, .27], [.5, .5], [.27, .73], [.73, .73]], 6: [[.27, .25], [.73, .25], [.27, .5], [.73, .5], [.27, .75], [.73, .75]] }[v];
    let h = `<g opacity="${used ? .35 : 1}"><rect x="${x}" y="${y + 2}" width="${s}" height="${s}" rx="9" fill="rgba(0,0,0,.18)"/>` +
      `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="9" fill="#3a22dc"/>`;
    for (const [a, b] of P) h += `<circle cx="${x + a * s}" cy="${y + b * s}" r="${s * .085}" fill="#fff"/>`;
    return h + '</g>';
  }
  // animate white step (and a possible hit) from state a to state b
  animate(a, st, b, o, ms, done) {
    const from = st.from === 25 ? this.barPos(true, a.wb - 1) : this.pos(st.from, a.pts[st.from] - 1, a.pts[st.from]);
    let to;
    if (st.to === 0) to = this.offPos(true, Engine.counts(b).wOff - 1);
    else to = this.pos(st.to, b.pts[st.to] - 1, b.pts[st.to]);
    const hitFrom = st.hit ? this.pos(st.to, 0, 1) : null, hitTo = st.hit ? this.barPos(false, b.bb - 1) : null;
    this.render(b, Object.assign({}, o, { hide: { w: st.to === 0 ? 0 : st.to, b: st.hit ? 25 : null } }));
    const ns = 'http://www.w3.org/2000/svg';
    const mk = white => { const g = document.createElementNS(ns, 'g'); g.innerHTML = this.checker(0, 0, white); this.svg.appendChild(g); return g; };
    const m1 = mk(true), m2 = st.hit ? mk(false) : null;
    const tok = ++this.tok;
    const t0 = performance.now(), ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const lift = Math.min(60, Math.hypot(to.x - from.x, to.y - from.y) * .18);
    const frame = now => {
      if (tok !== this.tok) return; // cancelled
      const t = Math.min(1, (now - t0) / ms), e = ease(t);
      const x = from.x + (to.x - from.x) * e, y = from.y + (to.y - from.y) * e - Math.sin(Math.PI * e) * lift;
      m1.setAttribute('transform', `translate(${x} ${y})`);
      if (m2) { const x2 = hitFrom.x + (hitTo.x - hitFrom.x) * e, y2 = hitFrom.y + (hitTo.y - hitFrom.y) * e; m2.setAttribute('transform', `translate(${x2} ${y2})`); }
      if (t < 1) requestAnimationFrame(frame); else { this.render(b, o); done && done(); }
    };
    if (m2) m2.setAttribute('transform', `translate(${hitFrom.x} ${hitFrom.y})`);
    m1.setAttribute('transform', `translate(${from.x} ${from.y})`);
    requestAnimationFrame(frame);
  }
  ghost(x, y) {
    let g = this.svg.querySelector('#ghost');
    if (!g) { g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); g.id = 'ghost'; g.innerHTML = this.checker(0, 0, true) + `<circle r="${G.R + 3}" fill="none" stroke="${COL.sel}" stroke-width="4"/>`; g.style.pointerEvents = 'none'; this.svg.appendChild(g); }
    g.setAttribute('transform', `translate(${x} ${y - 6}) scale(1.08)`);
  }
}

/* ===================================================================
   Exercise runtime
   =================================================================== */
const byId = Object.fromEntries(EXERCISES.map(e => [e.id, e]));
const TOT = (c, l) => EXERCISES.filter(e => e.c === c && (!l || e.l === l)).length;
const catName = c => CATS.find(x => x.id === c).name;
let board, SES = null, X = null, drag = null, pendingTarget = null, animTimer = 0;

function diceList(d) { return d[0] === d[1] ? [d[0], d[0], d[0], d[0]] : [d[0], d[1]]; }
function usedDice() {
  const ds = diceList(X.ex.d), used = ds.map(() => false);
  for (const st of X.hist) { const i = ds.findIndex((v, j) => v === st.die && !used[j]); if (i >= 0) used[i] = true; }
  return used;
}
// next legal single steps given a history
function stepsAfter(hist) {
  const n = hist.length, map = new Map();
  for (const p of X.plays) {
    if (p.seq.length <= n) continue;
    let ok = true;
    for (let i = 0; i < n; i++) { const a = p.seq[i], b = hist[i]; if (a.from !== b.from || a.to !== b.to || a.die !== b.die) { ok = false; break; } }
    if (ok) { const s = p.seq[n]; map.set(s.from + '-' + s.to + '-' + s.die, s); }
  }
  return [...map.values()];
}
// all destinations for one checker (single and combined moves) -> step path
function routesFrom(src) {
  const res = new Map();
  const walk = (hist, pos, path) => {
    const steps = stepsAfter(hist).filter(s => s.from === pos).sort((a, b) => a.die - b.die);
    for (const s of steps) {
      const np = path.concat([s]);
      if (!res.has(s.to) || res.get(s.to).length > np.length) res.set(s.to, np);
      if (s.to > 0) walk(hist.concat([s]), s.to, np);
    }
  };
  walk(X.hist, src, []);
  return res;
}
function boardOpts(extra = {}) {
  const o = { dice: X.ex.type === 'cube' ? null : X.ex.d, used: X.ex.type === 'cube' ? null : usedDice() };
  if (!X.checked && !X.busy && X.ex.type !== 'cube') {
    o.movable = new Set(stepsAfter(X.hist).map(s => s.from));
    if (X.sel != null) { o.sel = X.sel; o.targets = new Set(X.routes.keys()); o.trayHl = X.routes.has(0); }
  }
  return Object.assign(o, extra);
}
function draw() { board.render(X.view || X.state, boardOpts()); updatePips(X.view || X.state); }
function updatePips(s) { const p = Engine.pips(s); $('#pipW').textContent = p.w; $('#pipB').textContent = p.b; }

function loadExercise() {
  clearTimeout(animTimer); board.cancel();
  const ex = byId[SES.ids[SES.i]];
  const start = Engine.fromDef(ex);
  X = { ex, start, state: Engine.clone(start), hist: [], sel: null, routes: new Map(), checked: false, busy: false, result: null, view: null, choice: null };
  if (ex.type !== 'cube') {
    X.plays = Engine.plays(start, ex.d);
    X.maxLen = X.plays.length ? X.plays[0].seq.length : 0;
    const k = m => Engine.key(Engine.applyNotation(start, m));
    X.best = ex.best.map(k); X.near = (ex.near || []).map(x => k(x[0])); X.bad = (ex.bad || []).map(x => k(x[0]));
    X.bestSeq = (X.plays.find(p => Engine.key(p.final) === X.best[0]) || { seq: [] }).seq;
  }
  // header
  const total = SES.ids.length;
  $('#exChip').textContent = SES.mode === 'review' ? 'טעויות' : catName(ex.c) + ' · ' + LV[ex.l].name;
  $('#exCount').textContent = `${SES.i + 1}/${total}`;
  $('#exBar').style.width = (SES.i / total * 100) + '%';
  if (ex.type === 'cube') $('#exQ').textContent = ex.q;
  else $('#exQ').innerHTML = `הטלתם <span class="ltr">${ex.d[0]}-${ex.d[1]}</span>. מה הכי טוב? <small style="display:inline;font-weight:500;color:var(--muted)">(אתם בלבן)</small>`;
  const ctx = $('#exCtx'); ctx.hidden = !ex.ctx; ctx.textContent = ex.ctx || '';
  closeModal('expl');
  draw(); renderPanel();
}

/* ---------- Pointer interaction (tap-tap or drag) ---------- */
function sources() { return new Set(stepsAfter(X.hist).map(s => s.from)); }
function select(z) { X.sel = z; X.routes = z == null ? new Map() : routesFrom(z); draw(); }
function onDown(e) {
  if (!X || X.checked || X.busy || X.ex.type === 'cube') return;
  const pt = board.toSvg(e), z = board.zoneAt(pt.x, pt.y);
  pendingTarget = null;
  if (X.sel != null && z !== X.sel && X.routes.has(z)) { pendingTarget = z; return; }
  if (z != null && sources().has(z)) {
    if (X.sel !== z) select(z);
    drag = { src: z, x: pt.x, y: pt.y, moved: false };
    try { board.svg.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    e.preventDefault(); return;
  }
  if (X.sel != null) select(null);
}
function onMove(e) {
  if (!drag) return;
  const pt = board.toSvg(e);
  if (!drag.moved && Math.hypot(pt.x - drag.x, pt.y - drag.y) > 8) {
    drag.moved = true;
    const s = X.state; board.render(s, boardOpts({ hide: { w: drag.src } }));
  }
  if (drag.moved) board.ghost(pt.x, pt.y);
}
function onUp(e) {
  if (drag) {
    const d = drag; drag = null;
    if (d.moved) {
      const pt = board.toSvg(e), z = board.zoneAt(pt.x, pt.y);
      if (z != null && X.routes.has(z)) return runPath(X.routes.get(z), false);
      draw(); return;
    }
    return; // simple tap on a source keeps it selected
  }
  if (pendingTarget != null) { const z = pendingTarget; pendingTarget = null; if (X.routes.has(z)) runPath(X.routes.get(z), true); }
}
function runPath(path, animate) {
  X.sel = null; X.routes = new Map();
  if (!animate) { for (const st of path) { X.state = Engine.apply(X.state, st); X.hist.push(st); } draw(); renderPanel(); return; }
  X.busy = true; const me = X;
  const stepOne = i => {
    if (X !== me) return;
    if (i >= path.length) { X.busy = false; draw(); renderPanel(); return; }
    const st = path[i], a = X.state, b = Engine.apply(a, st);
    X.state = b; X.hist.push(st);
    board.animate(a, st, b, { dice: X.ex.d, used: usedDice() }, 260, () => stepOne(i + 1));
  };
  stepOne(0);
}
function undo() { if (!X.hist.length || X.busy) return; X.hist.pop(); X.state = X.hist.reduce((s, st) => Engine.apply(s, st), Engine.clone(X.start)); select(null); renderPanel(); }
function resetEx() { if (X.busy) return; X.hist = []; X.state = Engine.clone(X.start); select(null); renderPanel(); }

/* ---------- Checking + explanation ---------- */
function grade() {
  const k = Engine.key(X.state);
  return X.best.includes(k) ? 'correct' : X.near.includes(k) ? 'near' : 'wrong';
}
function check() {
  if (X.busy || X.checked) return;
  if (X.ex.type !== 'cube' && X.hist.length < X.maxLen) return;
  X.result = grade(); X.checked = true; X.userState = Engine.clone(X.state);
  finishCheck();
  animTimer = setTimeout(showCorrect, 650);
}
function chooseOpt(i) {
  if (X.checked) return;
  X.choice = i; X.result = X.ex.opts[i][1] ? 'correct' : 'wrong'; X.checked = true;
  finishCheck();
}
function finishCheck() {
  Store.record(X.ex.id, X.result);
  if (SES.res[SES.i] === undefined) SES.res[SES.i] = X.result; // first attempt counts in the summary
  draw(); renderPanel();
}
function showCorrect() {
  if (!X || !X.checked || X.ex.type === 'cube' || X.busy) return;
  clearTimeout(animTimer);
  X.busy = true; const me = X; let s = Engine.clone(X.start); X.view = s; const seq = X.bestSeq; const used = [];
  board.render(s, { dice: X.ex.d, used: diceList(X.ex.d).map(() => false) }); updatePips(s);
  const ds = diceList(X.ex.d);
  const stepOne = i => {
    if (X !== me) return;
    if (i >= seq.length) { X.busy = false; X.view = s; renderPanel(); return; }
    const st = seq[i], b = Engine.apply(s, st);
    const j = ds.findIndex((v, q) => v === st.die && !used[q]); if (j >= 0) used[j] = true;
    board.animate(s, st, b, { dice: X.ex.d, used: ds.map((_, q) => !!used[q]) }, 420, () => { if (X !== me) return; s = b; X.view = s; updatePips(s); animTimer = setTimeout(() => stepOne(i + 1), 160); });
  };
  animTimer = setTimeout(() => stepOne(0), 350);
}
function showMine() { if (X.busy) return; clearTimeout(animTimer); board.cancel(); X.view = X.userState; draw(); renderPanel(); }
function retry() { clearTimeout(animTimer); loadExercise(); }
function nextEx() {
  clearTimeout(animTimer);
  if (SES.i + 1 >= SES.ids.length) return showSummary();
  SES.i++; loadExercise();
}

// wrap glossary words in explanations with a clickable term
function glossify(text) {
  let out = esc(text); const used = new Set(); const parts = []; let count = 0;
  for (const [form, term] of TERM_FORMS) {
    if (used.has(term) || count >= 3) continue;
    const i = out.indexOf(form); if (i < 0) continue;
    parts.push(`<button class="term" data-term="${esc(term)}">${esc(form)}</button>`);
    out = out.slice(0, i) + '\u0001' + (parts.length - 1) + '\u0002' + out.slice(i + form.length);
    used.add(term); count++;
  }
  return out.replace(/\u0001(\d+)\u0002/g, (_, n) => parts[+n]);
}
function metric(m, live) {
  const ex = X.ex; if (!ex.flag) return '';
  let v = STATS[ex.id] && STATS[ex.id][m];
  if (v === undefined && live && ex.flag === 'shots') v = Engine.shots(live);
  if (v === undefined) return '';
  return ex.flag === 'shots' ? `<span class="metric">פוגעות: ${v}/36</span>` : `<span class="metric"><span class="ltr">${Number(v).toFixed(2)}</span> הטלות לסיום</span>`;
}
const RES = {
  correct: { cls: 'correct', icon: 'check', t: 'נכון!' },
  near: { cls: 'near', icon: 'half', t: 'כמעט' },
  wrong: { cls: 'wrong', icon: 'xx', t: 'לא מדויק' }
};
const nota = m => `<span class="ltr">${esc(m)}</span>`;
function renderPanel() {
  const ex = X.ex, P = $('#panel'); let h = '';
  if (!X.checked) {
    if (ex.type === 'cube') {
      h += '<div class="opts">' + ex.opts.map((o, i) => `<button class="opt" data-opt="${i}">${esc(o[0])}</button>`).join('') + '</div>';
    } else {
      const left = X.maxLen - X.hist.length;
      h += `<div class="moves-line">${X.hist.length ? nota(Engine.notate(X.hist)) + (left > 0 ? ` · עוד ${left === 1 ? 'קובייה' : left + ' קוביות'}` : '') : 'לחצו על חייל מסומן, או גררו אותו'}</div>`;
      h += `<div class="actions"><button class="btn btn-ghost" data-act="undo" ${X.hist.length ? '' : 'disabled'}>${I.undo}ביטול</button>` +
        `<button class="btn btn-primary" data-act="check" ${X.hist.length >= X.maxLen && !X.busy ? '' : 'disabled'}>${I.check}בדיקה</button></div>`;
    }
  } else {
    const r = RES[X.result];
    if (ex.type === 'cube') h += '<div class="opts" style="margin-bottom:8px">' + ex.opts.map((o, i) => `<button class="opt ${o[1] ? 'right' : (i === X.choice ? 'wrong' : '')}" disabled>${esc(o[0])}</button>`).join('') + '</div>';
    h += `<div class="fb ${r.cls}" role="status"><span class="ico">${I[r.icon]}</span><div><b>${r.t}</b><p>${esc(ex.p)}</p></div></div>`;
    h += `<div class="after"><button class="btn btn-ghost" data-act="explain">${I.bulb}הסבר</button>` +
      `<button class="btn btn-primary" data-act="next">${SES.i + 1 >= SES.ids.length ? 'סיום' : 'הבא'}${I.next}</button></div>`;
  }
  P.innerHTML = h;
}
function openExplain() {
  const ex = X.ex; let h = `<div class="principle">${I.bulb}<span>${esc(ex.p)}</span></div><p class="why">${glossify(ex.why)}</p>`;
  if (ex.type === 'cube') {
    h += '<ul class="alts">' + ex.opts.map(o => `<li><div class="row"><span class="tag ${o[1] ? 'best' : 'bad'}">${o[1] ? 'נכון' : 'שגוי'}</span><b>${esc(o[0])}</b></div><p>${esc(o[2])}</p></li>`).join('') + '</ul>';
  } else {
    const userKey = Engine.key(X.userState); const listed = [...X.best, ...X.near, ...X.bad].includes(userKey);
    const you = k => k === userKey ? '<span class="tag you">שלכם</span>' : '';
    let li = ex.best.map((m, i) => `<li><div class="row"><span class="tag best">הכי טוב</span>${nota(m)}${you(X.best[i])}${metric(m)}</div></li>`).join('');
    li += (ex.near || []).map((x, i) => `<li><div class="row"><span class="tag near">כמעט</span>${nota(x[0])}${you(X.near[i])}${metric(x[0])}</div><p>${esc(x[1])}</p></li>`).join('');
    li += (ex.bad || []).map((x, i) => `<li><div class="row"><span class="tag bad">חלש</span>${nota(x[0])}${you(X.bad[i])}${metric(x[0])}</div><p>${esc(x[1])}</p></li>`).join('');
    if (!listed) li += `<li><div class="row"><span class="tag you">שלכם</span>${nota(Engine.notate(X.hist))}${metric('__', X.userState)}</div></li>`;
    h += `<ul class="alts">${li}</ul>`;
  }
  h += '<div class="sheet-actions">';
  if (ex.type !== 'cube') {
    h += `<button class="btn btn-soft" data-act="replay">${I.play}הצגה על הלוח</button>`;
    if (X.result !== 'correct') h += `<button class="btn btn-ghost" data-act="mine">${I.eye}המהלך שלי</button>`;
  }
  if (X.result !== 'correct') h += `<button class="btn btn-ghost" data-act="retry">${I.reset}שוב</button>`;
  h += '</div>';
  $('#explTitle').textContent = ex.t; $('#explBody').innerHTML = h; $('#explBody').scrollTop = 0;
  $('#expl').classList.add('on');
}
function closeModal(id) { $('#' + id).classList.remove('on'); }

/* ---------- Sessions ---------- */
function startSession(cat, lvl) {
  const ids = EXERCISES.filter(e => e.c === cat && e.l === lvl).map(e => e.id);
  SES = { mode: 'cat', cat, lvl, ids, i: 0, res: [] }; X = null;
  go('#/play');
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startReview() {
  const ids = shuffle(Store.d.missed.filter(id => byId[id]));
  if (!ids.length) { SES = null; return false; }
  SES = { mode: 'review', ids, i: 0, res: [] }; X = null;
  return true;
}
function showSummary() {
  const n = SES.ids.length, c = SES.res.filter(r => r === 'correct').length, nr = SES.res.filter(r => r === 'near').length, w = n - c - nr;
  const pct = Math.round(c / n * 100), C = 2 * Math.PI * 60;
  let h = `<div class="score-ring"><svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="60" fill="none" stroke="#e2dcff" stroke-width="14"/><circle cx="70" cy="70" r="60" fill="none" stroke="url(#sg)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - c / n)}"/><defs><linearGradient id="sg"><stop offset="0" stop-color="#4a33f2"/><stop offset="1" stop-color="#00a492"/></linearGradient></defs></svg><b>${pct}%</b></div>`;
  h += `<h2>${pct >= 85 ? 'מצוין!' : pct >= 50 ? 'עבודה טובה' : 'ממשיכים ללמוד'}</h2><p style="color:var(--muted);font-weight:600">${SES.mode === 'review' ? 'סבב חזרה' : catName(SES.cat) + ' · ' + LV[SES.lvl].name}</p>`;
  h += `<div class="sum-split"><span style="background:var(--green-50);color:#076b44">${c} נכון</span><span style="background:var(--amber-50);color:#7a4a00">${nr} כמעט</span><span style="background:var(--rose-50);color:#9a1530">${w} לא</span></div><div class="sum-actions">`;
  if (SES.mode === 'cat' && SES.lvl < 3) h += `<button class="btn btn-primary" data-sum="next">לרמה הבאה: ${LV[SES.lvl + 1].name}</button>`;
  else if (SES.mode === 'cat') h += `<button class="btn btn-primary" data-sum="again">שוב</button>`;
  h += `<button class="btn btn-ghost" data-go="#/practice">לתפריט</button></div>`;
  $('#sumCard').innerHTML = h;
  go('#/summary');
}

/* ---------- Practice selection screen ---------- */
function recommendation() {
  const st = CATS.map(cat => ({ cat, s: Store.catStats(cat.id) }));
  const tried = st.filter(x => x.s.a >= 3);
  let pick, why;
  if (tried.length) { tried.sort((a, b) => a.s.c / a.s.a - b.s.c / b.s.a || a.s.solved - b.s.solved); pick = tried[0]; why = pick.s.acc >= 90 ? 'הדיוק שלכם גבוה בכל השלבים – שווה לחזור על הרמה המתקדמת כדי לשמור על כושר.' : `הדיוק שלכם כאן ${pick.s.acc}% – הנמוך ביותר מבין הקטגוריות.`; }
  else { st.sort((a, b) => a.s.a - b.s.a); pick = st[0]; why = pick.s.a ? 'עוד לא צברתם מספיק תרגילים כאן כדי למדוד דיוק.' : 'עוד לא התחלתם את השלב הזה – מקום מצוין להתחיל.'; }
  let lvl = 3; for (const l of [1, 2, 3]) { if (Store.catStats(pick.cat.id, l).solved < TOT(pick.cat.id, l)) { lvl = l; break; } }
  return { cat: pick.cat, lvl, why };
}
function renderPractice() {
  const all = EXERCISES.length; let a = 0, c = 0, solved = 0;
  for (const id in Store.d.res) { const r = Store.d.res[id]; if (!byId[id]) continue; a += r.a; c += r.c; if (r.solved) solved++; }
  const streak = Store.streak();
  $('#kpis').innerHTML =
    `<div class="kpi"><b>${streak}</b><span>ימי רצף</span></div>` +
    `<div class="kpi"><b>${solved}/${all}</b><span>הושלמו</span></div>` +
    `<div class="kpi"><b>${a ? Math.round(c / a * 100) + '%' : '–'}</b><span>דיוק</span></div>`;
  const rc = recommendation();
  $('#reco').innerHTML = solved >= all
    ? `<div class="allDone">סיימתם את כל ${all} התרגילים. סט חדש בדרך.</div>`
    : `<button class="reco" data-start="${rc.cat.id}:${rc.lvl}"><span class="ico">${I[rc.cat.icon]}</span><div><small>מומלץ עכשיו</small><b>${rc.cat.name} · ${LV[rc.lvl].name}</b></div>${I.next}</button>`;
  const L = Store.d.lvl;
  $('#lvlSeg').innerHTML = [1, 2, 3].map(l => `<button role="tab" aria-selected="${l === L}" class="${l === L ? 'on' : ''}" data-lvl="${l}"><span class="bars l${l}"><i></i><i></i><i></i></span>${LV[l].name}</button>`).join('');
  $('#catCards').innerHTML = CATS.map(cat => {
    const s = Store.catStats(cat.id, L), t = TOT(cat.id, L), done = s.solved >= t;
    return `<button class="cat ${done ? 'done' : ''}" data-start="${cat.id}:${L}"><span class="ico ${cat.cls}">${I[cat.icon]}</span><div><h3>${cat.name}<span>${s.solved}/${t}</span></h3><div class="progress"><i style="width:${s.solved / t * 100}%"></i></div></div>${I.next}</button>`;
  }).join('');
}

/* ---------- Landing ---------- */
let heroTimer = 0, heroBoard;
function heroLoop() {
  clearTimeout(heroTimer);
  if (!$('#v-home').classList.contains('on')) return;
  const s0 = Engine.fromDef({ w: { 24: 2, 13: 5, 8: 3, 6: 5 }, b: { 1: 2, 12: 5, 17: 3, 19: 5 } });
  const toast = $('#heroToast'); toast.classList.remove('show');
  heroBoard.render(s0, { dice: [3, 1], movable: new Set([8, 6]) });
  const st1 = { from: 8, to: 5, die: 3, hit: false }, s1 = Engine.apply(s0, st1);
  const st2 = { from: 6, to: 5, die: 1, hit: false }, s2 = Engine.apply(s1, st2);
  heroTimer = setTimeout(() => {
    heroBoard.animate(s0, st1, s1, { dice: [3, 1], used: [true, false] }, 520, () => {
      heroTimer = setTimeout(() => heroBoard.animate(s1, st2, s2, { dice: [3, 1], used: [true, true] }, 520, () => {
        toast.classList.add('show'); heroTimer = setTimeout(heroLoop, 2600);
      }), 250);
    });
  }, 1300);
}
/* ---------- Glossary ---------- */
function renderGloss(filter = '', flash = '') {
  const f = filter.trim();
  $('#glist').innerHTML = GLOSS.filter(g => !f || g[0].includes(f) || g[2].includes(f) || g[1].toLowerCase().includes(f.toLowerCase()))
    .map(g => `<div class="gitem ${g[0] === flash ? 'flash' : ''}" data-g="${esc(g[0])}"><b>${esc(g[0])}</b><small class="ltr">${esc(g[1])}</small><p>${esc(g[2])}</p></div>`).join('') || '<p style="color:var(--muted)">לא נמצא מושג.</p>';
}
function openGloss(term) {
  $('#gloss').classList.add('on'); $('#gsearch').value = ''; renderGloss('', term || '');
  if (term) { const el = $(`.gitem[data-g="${CSS.escape(term)}"]`); if (el) el.scrollIntoView({ block: 'center' }); }
  else $('#gsearch').focus({ preventScroll: true });
}


/* ---------- Router ---------- */
function go(h) { if (location.hash === h) route(); else location.hash = h; }
function show(v) {
  $$('.view').forEach(x => x.classList.toggle('on', x.id === 'v-' + v));
  $$('.nav [data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === v || (v === 'play' && SES && SES.mode === 'review' && b.dataset.nav === 'review')));
}
function route() {
  const h = location.hash || '#/';
  closeModal('expl'); closeModal('gloss');
  clearTimeout(animTimer);
  if (h === '#/practice') { renderPractice(); show('practice'); }
  else if (h === '#/review') {
    if (startReview()) { history.replaceState(null, '', '#/play'); show('play'); loadExercise(); }
    else { $('#sumCard').innerHTML = `<span class="ico t" style="margin:0 auto 12px">${I.check}</span><h2 style="margin-bottom:14px">אין טעויות לחזרה</h2><button class="btn btn-primary" data-go="#/practice" style="width:100%">לתרגול</button>`; show('summary'); }
  }
  else if (h === '#/play') { if (!SES) return go('#/practice'); show('play'); if (!X || X.ex.id !== SES.ids[SES.i]) loadExercise(); }
  else if (h === '#/summary') { if (!SES) return go('#/practice'); show('summary'); }
  else { show('home'); heroLoop(); }
}

/* ---------- Wiring ---------- */
function init() {
  Store.load(); updateBadge();
  board = new Board($('#board'), { homeRight: Store.d.homeRight });
  heroBoard = new Board($('#heroBoard'));
  const svg = $('#board');
  svg.addEventListener('pointerdown', onDown);
  svg.addEventListener('pointermove', onMove);
  svg.addEventListener('pointerup', onUp);
  svg.addEventListener('pointercancel', () => { drag = null; if (X) draw(); });
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-go],[data-scroll],[data-glossary],[data-start],[data-lvl],[data-act],[data-opt],[data-sum],.term');
    if (!t) return;
    if (t.dataset.go) return go(t.dataset.go);
    if (t.dataset.scroll) return $(t.dataset.scroll).scrollIntoView({ behavior: 'smooth' });
    if (t.hasAttribute('data-glossary')) return openGloss();
    if (t.classList.contains('term')) return openGloss(t.dataset.term);
    if (t.dataset.start) { const [c, l] = t.dataset.start.split(':'); return startSession(c, +l); }
    if (t.dataset.lvl) { Store.d.lvl = +t.dataset.lvl; Store.save(); return renderPractice(); }
    if (t.dataset.opt) return chooseOpt(+t.dataset.opt);
    if (t.dataset.sum === 'next') return startSession(SES.cat, SES.lvl + 1);
    if (t.dataset.sum === 'again') return startSession(SES.cat, SES.lvl);
    const a = t.dataset.act;
    if (['replay', 'mine', 'retry'].includes(a)) closeModal('expl');
    if (a === 'undo') undo(); else if (a === 'reset') resetEx(); else if (a === 'check') check(); else if (a === 'explain') openExplain();
    else if (a === 'replay') showCorrect(); else if (a === 'mine') showMine(); else if (a === 'retry') retry(); else if (a === 'next') nextEx();
  });
  $('#exBack').addEventListener('click', () => go('#/practice'));
  $('#flipBtn').addEventListener('click', () => { Store.d.homeRight = !Store.d.homeRight; Store.save(); board.homeRight = Store.d.homeRight; if (X && !X.busy) draw(); });
  $$('[data-close]').forEach(b => b.addEventListener('click', () => closeModal(b.dataset.close)));
  $$('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('on'); }));
  $('#gsearch').addEventListener('input', e => renderGloss(e.target.value));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal('gloss'); closeModal('expl'); } });
  window.addEventListener('hashchange', route);
  route();
}
init();
})();
